[extend]
# Extender las reglas por defecto de gitleaks
useDefault = true

[allowlist]
description = "Allowlist for ESP32 project"
regexes = [
  # Clave pública de ejemplo para el AP local de configuración
  '''monitor1234''',
  # Nombre de variante de seguridad Bluetooth en el código vendorizado;
  # no es una credencial.
  '''Acceptor16DigitEncrypt''',
]
paths = [
  '''.*\.example''',
]
