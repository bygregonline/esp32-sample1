<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="250mm" viewBox="0 0 300 250">
  <title>ESP32 telemetry MVP acrylic panels — millimetres, 1:1</title>
  <desc>Red paths are through cuts. Front 145 by 92, rear 145 by 82, two angled side cheeks. Sheet envelope 300 by 250 mm.</desc>
  <g fill="none" stroke="#ff0000" stroke-width="0.15">
    <!-- FRONT PANEL 145 x 92 -->
    <rect x="5" y="5" width="145" height="92"/>
    <!-- 1.9 inch LCD visible area -->
    <rect x="27" y="29" width="24" height="44"/>
    <!-- 0.96 inch OLED visible area -->
    <rect x="84" y="41" width="27" height="20"/>
    <!-- M3 panel/cheek attachment holes -->
    <circle cx="12" cy="19" r="2.1"/><circle cx="143" cy="19" r="2.1"/>
    <circle cx="12" cy="83" r="2.1"/><circle cx="143" cy="83" r="2.1"/>
    <!-- Adjustable display retention / cable pass slots -->
    <rect x="18.4" y="22.9" width="9.2" height="4.2" rx="2.1"/>
    <rect x="51.4" y="22.9" width="9.2" height="4.2" rx="2.1"/>
    <rect x="18.4" y="74.9" width="9.2" height="4.2" rx="2.1"/>
    <rect x="51.4" y="74.9" width="9.2" height="4.2" rx="2.1"/>
    <rect x="75.4" y="33.9" width="9.2" height="4.2" rx="2.1"/>
    <rect x="110.4" y="33.9" width="9.2" height="4.2" rx="2.1"/>
    <rect x="75.4" y="63.9" width="9.2" height="4.2" rx="2.1"/>
    <rect x="110.4" y="63.9" width="9.2" height="4.2" rx="2.1"/>
    <!-- REAR PANEL 145 x 82 -->
    <rect x="155" y="5" width="145" height="82"/>
    <rect x="212.5" y="78" width="30" height="10"/>
    <circle cx="162" cy="17" r="2.1"/><circle cx="293" cy="17" r="2.1"/>
    <circle cx="162" cy="75" r="2.1"/><circle cx="293" cy="75" r="2.1"/>
    <!-- SIDE CHEEKS: 82 x 118 envelope; sloped edge follows 18-degree face -->
    <path d="M5 112 L87 112 L87 126 L33.4 230 L5 143 Z"/>
    <path d="M95 112 L177 112 L177 126 L123.4 230 L95 143 Z"/>
    <!-- M3 holes for right-angle brackets: front edge and base, each cheek -->
    <circle cx="12.3" cy="155.3" r="2.1"/><circle cx="32" cy="216.2" r="2.1"/>
    <circle cx="17" cy="119" r="2.1"/><circle cx="75" cy="119" r="2.1"/>
    <circle cx="102.3" cy="155.3" r="2.1"/><circle cx="122" cy="216.2" r="2.1"/>
    <circle cx="107" cy="119" r="2.1"/><circle cx="165" cy="119" r="2.1"/>
  </g>
  <g fill="#333" font-family="sans-serif" font-size="3.4">
    <text x="5" y="103">FRONT — 145 × 92 mm</text>
    <text x="27" y="27">LCD window 24 × 44</text>
    <text x="84" y="39">OLED window 27 × 20</text>
    <text x="155" y="93">REAR — 145 × 82 mm</text>
    <text x="5" y="240">SIDE CHEEKS ×2 — 82 × 118 mm envelope</text>
    <text x="5" y="247">RED = THROUGH CUT • SVG units are millimetres • 1:1 scale</text>
  </g>
</svg>
