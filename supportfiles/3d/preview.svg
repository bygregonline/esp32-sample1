<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101923"/><stop offset="1" stop-color="#192735"/></linearGradient>
 <linearGradient id="face" x2="0" y2="1"><stop stop-color="#283746"/><stop offset="1" stop-color="#121b24"/></linearGradient>
 <linearGradient id="lcd" x2="1" y2="1"><stop stop-color="#13697d"/><stop offset=".5" stop-color="#1f8db0"/><stop offset="1" stop-color="#162f57"/></linearGradient>
 <filter id="shadow" x="-.4" y="-.4" width="1.8" height="1.8"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1400" height="900" fill="url(#bg)"/>
<circle cx="1140" cy="120" r="270" fill="#36c2d2" opacity=".08"/>
<text x="76" y="92" fill="#79e0db" font-family="Arial,sans-serif" font-size="20" letter-spacing="4">ESP32 TELEMETRY • MVP ENCLOSURE</text>
<text x="76" y="152" fill="#f3f6f8" font-family="Arial,sans-serif" font-weight="700" font-size="44">3D-printed desktop prototype</text>
<text x="76" y="194" fill="#aab9c5" font-family="Arial,sans-serif" font-size="21">Angled stand • dual displays • serviceable rear electronics</text>
<!-- soft shadow -->
<ellipse cx="729" cy="711" rx="370" ry="62" fill="#000" opacity=".45" filter="url(#shadow)"/>
