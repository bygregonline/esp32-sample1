<path d="M405 543 L481 518 L481 689 L392 715 L374 692 Z" fill="#263746" stroke="#526678" stroke-width="3"/>
<path d="M966 523 L1042 500 L1042 668 L966 690 Z" fill="#1a2732" stroke="#526678" stroke-width="3"/>
