<path d="M510 358 L638 351 L658 521 L530 529 Z" fill="#08151c" stroke="#92a7b3" stroke-width="5"/>
<path d="M520 367 L630 361 L647 512 L538 520 Z" fill="url(#lcd)"/>
<path d="M530 386 L615 381" stroke="#b9f5dd" stroke-width="4" opacity=".9"/>
<path d="M536 405 L615 401 M538 421 L606 417 M542 464 L615 460 M544 480 L593 477" stroke="#d7f7ef" stroke-width="3" opacity=".68"/>
<circle cx="593" cy="440" r="19" fill="none" stroke="#f4a261" stroke-width="4" stroke-dasharray="92 28" transform="rotate(-90 593 440)"/>
<text x="585" y="446" fill="white" font-family="Arial" font-size="12">08</text>
<!-- OLED -->
<path d="M737 393 L869 386 L876 477 L744 484 Z" fill="#080d11" stroke="#8395a0" stroke-width="5"/>
<path d="M749 403 L859 397 L864 467 L755 474 Z" fill="#061a15"/>
<text x="762" y="425" fill="#8affb8" font-family="monospace" font-size="13">ESP32 MONITOR</text>
<text x="763" y="445" fill="#a7eac2" font-family="monospace" font-size="11">TEMP  23.8 C</text>
<text x="763" y="460" fill="#a7eac2" font-family="monospace" font-size="11">GPS   FIX</text>
<!-- accent screws -->
<g fill="#a9bac3" stroke="#10171c" stroke-width="2"><circle cx="451" cy="319" r="8"/><circle cx="951" cy="293" r="8"/><circle cx="483" cy="610" r="8"/><circle cx="991" cy="584" r="8"/></g>
<g stroke="#334653" stroke-width="2"><path d="M445 319h12m-6-6v12M945 293h12m-6-6v12M477 610h12m-6-6v12M985 584h12m-6-6v12"/></g>
<!-- board visible behind -->
<path d="M662 676 L816 669 L840 690 L685 699 Z" fill="#177d68" stroke="#69baa4" stroke-width="3"/>
<rect x="704" y="678" width="35" height="10" rx="3" fill="#c9d6dc" transform="rotate(-3 704 678)"/>
<text x="755" y="692" fill="#d8eee5" font-family="Arial" font-size="11">ESP32 • rear-mounted</text>
<!-- bottom specs -->
<rect x="76" y="778" width="1248" height="1" fill="#40515e"/>
<text x="76" y="827" fill="#dbe6eb" font-family="Arial" font-size="17">145 × 92 mm front panel</text>
<text x="430" y="827" fill="#dbe6eb" font-family="Arial" font-size="17">18° viewing angle</text>
<text x="760" y="827" fill="#dbe6eb" font-family="Arial" font-size="17">M3 screw assembly</text>
<text x="1080" y="827" fill="#f4bf77" font-family="Arial" font-size="16">CONCEPT PREVIEW</text>
