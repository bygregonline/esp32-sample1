minimum_pre_commit_version: "3.0.0"
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # ── Python project validation ──────────────────────────────
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "v0.27"
    hooks:
      - id: validate-pyproject

  # ── uv lockfile consistency ────────────────────────────────
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6
    hooks:
      - id: uv-lock

  # ── Secret detection ───────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)^(
            uv\.lock|
            rust/Cargo\.lock|
            .*\.md
          )$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: gitleaks detect
        entry: gitleaks detect
        language: system
        args: ["--config", ".gitleaks.toml", "--redact"]
        always_run: true
        pass_filenames: false

  # ── Shell scripts ──────────────────────────────────────────
  - repo: local
    hooks:
      - id: shellcheck-project-scripts
        name: shellcheck project scripts
        entry: bash scripts/run_shellcheck.sh --roots "scripts c/scripts python/scripts rust/scripts arduino/scripts"
        language: system
        pass_filenames: false

      - id: subrepo-status
        name: show subrepo status
        entry: bash -c 'python3 utils/subrepo_status.py || true'
        language: system
        always_run: true
        verbose: true
        pass_filenames: false

  # ── General file hygiene ───────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: debug-statements
      - id: check-added-large-files
        args: ["--maxkb=20000"]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-toml
      - id: check-json
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: end-of-file-fixer
        files: ^(scripts|utils)/.*$
      - id: trailing-whitespace
        files: ^(scripts|utils)/.*$

  # ── Git stats / project summary ────────────────────────────
  - repo: local
    hooks:
      - id: show-stats
        name: show git stats
        entry: bash scripts/show_stats.sh
        language: system
        always_run: true
        verbose: true
        pass_filenames: false

  # ── Python (host tools only, not MicroPython firmware) ─────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.10
    hooks:
      - id: ruff
        name: ruff lint (host Python)
        args: ["--fix"]
        files: ^(utils|scripts|tests)/.*\.py$
      - id: ruff-format
        name: ruff format (host Python)
        files: ^(utils|scripts|tests)/.*\.py$

  # ── C / ESP-IDF ────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        name: clang-format (C sources)
        files: ^c/main/.*\.(c|h)$
        args: ["--style=file", "--fallback-style=Google"]

  # ── Rust ───────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: cargo-fmt-check
        name: cargo fmt check
        entry: bash -c 'cd rust && cargo fmt --check 2>&1'
        language: system
        files: ^rust/.*\.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (warnings as errors)
        entry: bash -c '. rust/export-esp.sh 2>/dev/null || true; cd rust && cargo clippy -- -D warnings 2>&1'
        language: system
        files: ^rust/.*\.rs$
        pass_filenames: false

  # ── Markdown ───────────────────────────────────────────────
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.yaml", "--fix"]
        files: ^.*\.md$

  # ── Generated root README ───────────────────────────────────
  - repo: local
    hooks:
      - id: generate-readme
        name: regenerate root README
        entry: python3 scripts/generate_readme.py
        language: system
        always_run: true
        pass_filenames: false
